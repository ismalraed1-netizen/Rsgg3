<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة المستفيدين - جمعية بناء وتنمية</title>
    
    <!-- خطوط جوجل (Cairo) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- مكتبة الأيقونات المضمونة (FontAwesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- إعدادات Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Cairo', 'sans-serif'] },
                    colors: {
                        brand: {
                            orange: '#ee7818',
                            green: '#80ba3c',
                            gray: '#9ea1a2'
                        }
                    }
                }
            }
        }
    </script>

    <!-- مكتبات React الأساسية للعمل بدون سيرفر -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- مكتبات Firebase الآمنة للعمل المباشر -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 antialiased">
    
    <!-- المكان الذي سيعمل فيه التطبيق -->
    <div id="root"></div>

    <!-- كود التطبيق بالكامل -->
    <script type="text/babel">
        const { useState, useEffect } = React;

        // =========================================================================
        // 🔴 إعدادات قاعدة البيانات السحابية FIREBASE 🔴
        // إذا لم تضع بياناتك هنا، سيعمل الموقع بشكل محلي للتجربة فقط ولن يحفظ البيانات.
        // =========================================================================
        const firebaseConfig = {
            apiKey: "ضع_مفتاح_API_هنا",
            authDomain: "ضع_نطاق_المصادقة_هنا",
            projectId: "ضع_معرف_المشروع_هنا",
            storageBucket: "ضع_سلة_التخزين_هنا",
            messagingSenderId: "ضع_رقم_المرسل_هنا",
            appId: "ضع_معرف_التطبيق_هنا"
        };

        const isFirebaseConfigured = firebaseConfig.apiKey !== "ضع_مفتاح_API_هنا";

        // تهيئة قاعدة البيانات
        let auth, db;
        if (isFirebaseConfigured) {
            firebase.initializeApp(firebaseConfig);
            auth = firebase.auth();
            db = firebase.firestore();
        }

        // شعار الجمعية
        const BrandLogo = ({ className = "w-24 h-24" }) => (
            <svg viewBox="0 0 200 200" className={className} xmlns="http://www.w3.org/2000/svg">
                <path d="M 45 70 L 80 85 L 80 135 L 45 135 Z" fill="#9ea1a2" opacity="0.8" />
                <path d="M 120 85 L 155 70 L 155 135 L 120 135 Z" fill="#9ea1a2" opacity="0.8" />
                <path d="M 85 30 L 115 30 L 115 135 L 85 135 Z" fill="#ee7818" />
                <path d="M 25 125 Q 100 160 100 180 Q 100 160 175 125 Q 190 100 185 140 Q 100 195 15 140 Q 10 100 25 125 Z" fill="#80ba3c" />
            </svg>
        );

        function App() {
            const [isUiAuthenticated, setIsUiAuthenticated] = useState(false);
            const [loginUsername, setLoginUsername] = useState('');
            const [loginPassword, setLoginPassword] = useState('');
            const [loginError, setLoginError] = useState('');
            
            const [beneficiaries, setBeneficiaries] = useState([]);
            const [isLoading, setIsLoading] = useState(false);
            const [formData, setFormData] = useState({ name: '', phone: '', targetAssoc: 'جمعية سكني الجميل' });
            const [notification, setNotification] = useState('');

            // جلب البيانات من السحابة
            useEffect(() => {
                if (!isUiAuthenticated || !isFirebaseConfigured) return;
                
                const initAuth = async () => {
                    try {
                        await auth.signInAnonymously();
                    } catch (error) {
                        console.error("Auth Error:", error);
                    }
                };
                initAuth();

                setIsLoading(true);
                const unsubscribe = db.collection('beneficiaries')
                    .orderBy("createdAt", "desc")
                    .onSnapshot((snapshot) => {
                        const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        setBeneficiaries(data);
                        setIsLoading(false);
                    }, (error) => {
                        console.error("Firestore error:", error);
                        setIsLoading(false);
                    });

                return () => unsubscribe();
            }, [isUiAuthenticated]);

            const showNotification = (msg) => {
                setNotification(msg);
                setTimeout(() => setNotification(''), 3000);
            };

            const handleLogin = (e) => {
                e.preventDefault();
                if (loginUsername.toLowerCase() === 'admin' && loginPassword === 'binaa2024') {
                    setIsUiAuthenticated(true);
                    setLoginError('');
                } else {
                    setLoginError('اسم المستخدم أو كلمة المرور غير صحيحة');
                }
            };

            const formatPhoneNumber = (phone) => {
                let cleaned = phone.replace(/\D/g, ''); 
                if (cleaned.startsWith('966')) return cleaned;
                else if (cleaned.startsWith('05')) return '966' + cleaned.substring(1);
                else if (cleaned.startsWith('5')) return '966' + cleaned;
                return cleaned;
            };

            const generateMessage = (target) => {
                return `السلام عليكم ورحمة الله وبركاته،\n\nنفيدكم بأنه سبق استلام ملفكم لدى جمعية بناء وتنمية مساكن، وقد تم نقل ملفكم إلى ${target} لاستكمال إجراءات الطلب ومتابعته من قبلهم.\n\nلأي استفسار، نأمل التواصل مع الجمعية المذكورة مباشرة.\n\nشاكرين لكم تعاونكم، مع خالص تمنياتنا بالتوفيق.`;
            };

            const handleAddBeneficiary = async (e) => {
                e.preventDefault();
                if (!formData.name || !formData.phone || !formData.targetAssoc) return;

                if (!isFirebaseConfigured) {
                    // العمل محلياً للتجربة إذا لم تضع بيانات فايربيس
                    const newBen = { ...formData, id: Date.now().toString(), status: 'pending', createdAt: Date.now() };
                    setBeneficiaries([newBen, ...beneficiaries]);
                    setFormData({ ...formData, name: '', phone: '' });
                    showNotification('تمت الإضافة (مؤقتاً للنسخة التجريبية)');
                    return;
                }

                try {
                    await db.collection('beneficiaries').add({
                        name: formData.name,
                        phone: formData.phone, 
                        targetAssoc: formData.targetAssoc,
                        status: 'pending',
                        createdAt: Date.now()
                    });
                    setFormData({ ...formData, name: '', phone: '' });
                    showNotification('تم الحفظ السحابي بنجاح');
                } catch (error) {
                    console.error("Error adding doc:", error);
                    showNotification('حدث خطأ أثناء الإضافة');
                }
            };

            const handleSendWhatsApp = async (beneficiary) => {
                const formattedPhone = formatPhoneNumber(beneficiary.phone);
                const message = encodeURIComponent(generateMessage(beneficiary.targetAssoc));
                
                // فتح الواتساب
                window.open(`https://wa.me/${formattedPhone}?text=${message}`, '_blank');

                if (isFirebaseConfigured) {
                    try {
                        await db.collection('beneficiaries').doc(beneficiary.id).update({
                            status: 'sent',
                            sentAt: Date.now()
                        });
                    } catch (error) {
                        console.error("Error updating:", error);
                    }
                } else {
                    // تحديث الحالة محلياً للنسخة التجريبية
                    setBeneficiaries(beneficiaries.map(b => b.id === beneficiary.id ? {...b, status: 'sent'} : b));
                }
            };

            const handleDelete = async (id) => {
                if (window.confirm('هل أنت متأكد من حذف هذا المستفيد نهائياً؟')) {
                    if (isFirebaseConfigured) {
                        try {
                            await db.collection('beneficiaries').doc(id).delete();
                            showNotification('تم الحذف بنجاح');
                        } catch (error) {
                            console.error("Error deleting:", error);
                        }
                    } else {
                         setBeneficiaries(beneficiaries.filter(b => b.id !== id));
                    }
                }
            };

            // واجهة تسجيل الدخول
            if (!isUiAuthenticated) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-gray-50">
                        <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border-t-4 border-brand-orange">
                            <div className="flex flex-col items-center mb-8">
                                <BrandLogo className="w-28 h-28 mb-4 drop-shadow-md" />
                                <h1 className="text-2xl font-bold text-gray-800 text-center">جمعية بناء وتنمية مساكن</h1>
                                <p className="text-sm mt-1 font-bold text-brand-green">بوابة إشعار المستفيدين</p>
                            </div>

                            <form onSubmit={handleLogin} className="space-y-5">
                                {loginError && (
                                    <div className="bg-red-50 text-red-600 p-3 rounded-lg text-sm text-center font-bold">
                                        <i className="fas fa-exclamation-circle ml-2"></i>
                                        {loginError}
                                    </div>
                                )}
                                
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-1.5">اسم المستخدم</label>
                                    <input 
                                        type="text" 
                                        value={loginUsername}
                                        onChange={(e) => setLoginUsername(e.target.value)}
                                        className="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-brand-orange outline-none"
                                        placeholder="أدخل اسم المستخدم" required dir="ltr"
                                    />
                                </div>
                                
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-1.5">كلمة المرور</label>
                                    <input 
                                        type="password" 
                                        value={loginPassword}
                                        onChange={(e) => setLoginPassword(e.target.value)}
                                        className="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-brand-orange outline-none"
                                        placeholder="••••••••" required dir="ltr"
                                    />
                                </div>

                                <button type="submit" className="w-full text-white font-bold py-3 rounded-lg bg-brand-orange hover:bg-orange-600 transition-all shadow-lg">
                                    <i className="fas fa-shield-alt ml-2"></i> تسجيل الدخول
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            const stats = {
                total: beneficiaries.length,
                sent: beneficiaries.filter(b => b.status === 'sent').length,
                pending: beneficiaries.filter(b => b.status === 'pending').length,
            };

            return (
                <div className="min-h-screen pb-12">
                    {notification && (
                        <div className="fixed bottom-6 left-6 bg-gray-900 text-white px-6 py-3 rounded-xl shadow-2xl flex items-center z-50">
                            <i className="fas fa-check-circle ml-3 text-brand-green text-xl"></i>
                            <span className="font-bold">{notification}</span>
                        </div>
                    )}

                    <header className="bg-white shadow-sm border-b-4 border-brand-orange sticky top-0 z-40">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex items-center justify-between">
                            <div className="flex items-center space-x-4 space-x-reverse">
                                <BrandLogo className="w-14 h-14" />
                                <div>
                                    <h1 className="text-xl font-bold text-brand-gray">بوابة إشعار النقل</h1>
                                    <p className="text-xs font-bold mt-1 text-brand-green flex items-center">
                                        جمعية بناء وتنمية مساكن
                                        {isFirebaseConfigured ? (
                                            <span className="mr-2 text-green-500"><i className="fas fa-wifi text-xs"></i> متصل بالسحابة</span>
                                        ) : (
                                            <span className="mr-2 text-red-500"><i className="fas fa-wifi text-xs"></i> غير متصل</span>
                                        )}
                                    </p>
                                </div>
                            </div>
                            <button onClick={() => setIsUiAuthenticated(false)} className="px-4 py-2 text-sm font-bold text-red-600 bg-red-50 hover:bg-red-100 rounded-lg">
                                <i className="fas fa-sign-out-alt ml-2"></i> خروج
                            </button>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        {!isFirebaseConfigured && (
                            <div className="mb-8 bg-red-50 border border-red-200 text-red-700 px-6 py-4 rounded-xl flex items-start shadow-sm">
                                <i className="fas fa-exclamation-triangle text-2xl ml-3 mt-1"></i>
                                <div>
                                    <h3 className="font-bold text-lg mb-1">النظام غير متصل بقاعدة البيانات الحقيقية!</h3>
                                    <p className="text-sm">أنت الآن تستخدم النظام كنسخة تجريبية، إذا أغلقت الصفحة ستضيع الأسماء. يجب عليك وضع أكواد (Firebase) داخل الملف ليتم الحفظ بشكل دائم.</p>
                                </div>
                            </div>
                        )}

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                            <div className="bg-white rounded-xl shadow-sm p-6 border-r-4 border-brand-gray flex items-center">
                                <div className="p-4 rounded-lg bg-gray-100 text-brand-gray ml-4"><i className="fas fa-users text-2xl"></i></div>
                                <div><p className="text-sm text-gray-500 font-bold">إجمالي المستفيدين</p><p className="text-3xl font-black">{stats.total}</p></div>
                            </div>
                            <div className="bg-white rounded-xl shadow-sm p-6 border-r-4 border-brand-green flex items-center">
                                <div className="p-4 rounded-lg bg-green-50 text-brand-green ml-4"><i className="fas fa-check-circle text-2xl"></i></div>
                                <div><p className="text-sm text-gray-500 font-bold">تم الإرسال</p><p className="text-3xl font-black">{stats.sent}</p></div>
                            </div>
                            <div className="bg-white rounded-xl shadow-sm p-6 border-r-4 border-brand-orange flex items-center">
                                <div className="p-4 rounded-lg bg-orange-50 text-brand-orange ml-4"><i className="fas fa-comment-dots text-2xl"></i></div>
                                <div><p className="text-sm text-gray-500 font-bold">بانتظار الإرسال</p><p className="text-3xl font-black">{stats.pending}</p></div>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            <div className="lg:col-span-1">
                                <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden sticky top-24">
                                    <div className="px-6 py-5 bg-green-50/50 border-b">
                                        <h2 className="text-lg font-bold text-brand-green"><i className="fas fa-user-plus ml-2"></i> إضافة مستفيد للنقل</h2>
                                    </div>
                                    <div className="p-6">
                                        <form onSubmit={handleAddBeneficiary} className="space-y-5">
                                            <div>
                                                <label className="block text-sm font-bold text-gray-700 mb-2">اسم المستفيد</label>
                                                <input type="text" required value={formData.name} onChange={(e) => setFormData({...formData, name: e.target.value})} className="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-brand-green outline-none" placeholder="الاسم الثلاثي أو الرباعي" />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-bold text-gray-700 mb-2">رقم الجوال</label>
                                                <input type="tel" required value={formData.phone} onChange={(e) => setFormData({...formData, phone: e.target.value})} className="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-brand-green outline-none text-left" placeholder="05XXXXXXXX" dir="ltr" />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-bold text-gray-700 mb-2">الجمعية المنقول إليها</label>
                                                <input type="text" required value={formData.targetAssoc} onChange={(e) => setFormData({...formData, targetAssoc: e.target.value})} className="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:
