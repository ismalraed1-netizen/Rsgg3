<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة المستفيدين - جمعية بناء وتنمية</title>
    
    <!-- خطوط جوجل (الخط العربي Cairo) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- إعدادات Tailwind CSS للألوان والهوية -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Cairo', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            orange: '#ee7818',
                            green: '#80ba3c',
                            gray: '#9ea1a2'
                        }
                    }
                }
            }
        }
    </script>

    <!-- مترجم React للمتصفح -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- روابط المكتبات الحديثة (React + Firebase + Icons) -->
    <script type="importmap">
        {
            "imports": {
                "react": "https://esm.sh/react@18.2.0",
                "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
                "lucide-react": "https://esm.sh/lucide-react@0.292.0",
                "firebase/app": "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js"
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 antialiased selection:bg-brand-green selection:text-white">
    
    <!-- المكان الذي سيعمل فيه تطبيق React -->
    <div id="root"></div>

    <!-- برمجة النظام بالكامل -->
    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            Users, Send, CheckCircle, FileText, UserPlus, Phone, Building, 
            AlertCircle, MessageCircle, LogOut, Trash2, ShieldCheck, Loader2
        } from 'lucide-react';
        import { initializeApp } from 'firebase/app';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'firebase/auth';
        import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, query, orderBy } from 'firebase/firestore';

        // =========================================================================
        // 🔴🔴🔴 إعدادات قاعدة البيانات السحابية FIREBASE 🔴🔴🔴
        // لكي يتم حفظ البيانات بين الكمبيوتر والجوال، قم بإنشاء مشروع في Firebase
        // واستبدل هذه القيم ببيانات مشروعك الحقيقية.
        // =========================================================================
        const firebaseConfig = {
            apiKey: "ضع_مفتاح_API_هنا",
            authDomain: "ضع_نطاق_المصادقة_هنا",
            projectId: "ضع_معرف_المشروع_هنا",
            storageBucket: "ضع_سلة_التخزين_هنا",
            messagingSenderId: "ضع_رقم_المرسل_هنا",
            appId: "ضع_معرف_التطبيق_هنا"
        };

        // التحقق من أن المستخدم قام بوضع بياناته
        const isFirebaseConfigured = firebaseConfig.apiKey !== "ضع_مفتاح_API_هنا";

        let app, auth, db;
        if (isFirebaseConfigured) {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        }

        // شعار الجمعية
        const BrandLogo = ({ className = "w-24 h-24" }) => (
            <svg viewBox="0 0 200 200" className={className} xmlns="http://www.w3.org/2000/svg">
                <path d="M 45 70 L 80 85 L 80 135 L 45 135 Z" fill="#9ea1a2" opacity="0.8" />
                <path d="M 120 85 L 155 70 L 155 135 L 120 135 Z" fill="#9ea1a2" opacity="0.8" />
                <path d="M 85 30 L 115 30 L 115 135 L 85 135 Z" fill="#ee7818" />
                <path d="M 25 125 Q 100 160 100 180 Q 100 160 175 125 Q 190 100 185 140 Q 100 195 15 140 Q 10 100 25 125 Z" fill="#80ba3c" />
            </svg>
        );

        function App() {
            const [isUiAuthenticated, setIsUiAuthenticated] = useState(false);
            const [loginUsername, setLoginUsername] = useState('');
            const [loginPassword, setLoginPassword] = useState('');
            const [loginError, setLoginError] = useState('');
            
            const [beneficiaries, setBeneficiaries] = useState([]);
            const [isLoading, setIsLoading] = useState(false);
            const [formData, setFormData] = useState({ name: '', phone: '', targetAssoc: 'جمعية سكني الجميل' });
            const [notification, setNotification] = useState('');

            // محاولة الاتصال بقاعدة البيانات
            useEffect(() => {
                if (!isUiAuthenticated || !isFirebaseConfigured) return;
                
                const initAuth = async () => {
                    try {
                        await signInAnonymously(auth);
                    } catch (error) {
                        console.error("Auth Error:", error);
                    }
                };
                initAuth();

                setIsLoading(true);
                const dataRef = collection(db, 'beneficiaries');
                // جلب البيانات وترتيبها من الأحدث للأقدم
                const q = query(dataRef, orderBy("createdAt", "desc"));

                const unsubscribe = onSnapshot(q, (snapshot) => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setBeneficiaries(data);
                    setIsLoading(false);
                }, (error) => {
                    console.error("Firestore error:", error);
                    setIsLoading(false);
                });

                return () => unsubscribe();
            }, [isUiAuthenticated]);

            const showNotification = (msg) => {
                setNotification(msg);
                setTimeout(() => setNotification(''), 3000);
            };

            const handleLogin = (e) => {
                e.preventDefault();
                if (loginUsername.toLowerCase() === 'admin' && loginPassword === 'binaa2024') {
                    setIsUiAuthenticated(true);
                    setLoginError('');
                } else {
                    setLoginError('اسم المستخدم أو كلمة المرور غير صحيحة');
                }
            };

            const formatPhoneNumber = (phone) => {
                let cleaned = phone.replace(/\D/g, ''); 
                if (cleaned.startsWith('966')) return cleaned;
                else if (cleaned.startsWith('05')) return '966' + cleaned.substring(1);
                else if (cleaned.startsWith('5')) return '966' + cleaned;
                return cleaned; // في حال كتب الرقم بصيغة أخرى
            };

            const generateMessage = (target) => {
                return `السلام عليكم ورحمة الله وبركاته،\n\nنفيدكم بأنه سبق استلام ملفكم لدى جمعية بناء وتنمية مساكن، وقد تم نقل ملفكم إلى ${target} لاستكمال إجراءات الطلب ومتابعته من قبلهم.\n\nلأي استفسار، نأمل التواصل مع الجمعية المذكورة مباشرة.\n\nشاكرين لكم تعاونكم، مع خالص تمنياتنا بالتوفيق.`;
            };

            const handleAddBeneficiary = async (e) => {
                e.preventDefault();
                if (!formData.name || !formData.phone || !formData.targetAssoc) return;

                if (!isFirebaseConfigured) {
                    alert("⚠️ قاعدة البيانات (Firebase) غير متصلة. يرجى إضافة الإعدادات في ملف HTML.");
                    return;
                }

                try {
                    const dataRef = collection(db, 'beneficiaries');
                    await addDoc(dataRef, {
                        name: formData.name,
                        phone: formData.phone, 
                        targetAssoc: formData.targetAssoc,
                        status: 'pending',
                        createdAt: Date.now()
                    });
                    setFormData({ ...formData, name: '', phone: '' }); // نبقي اسم الجمعية كما هو للتسهيل
                    showNotification('تم الحفظ بنجاح');
                } catch (error) {
                    console.error("Error adding doc:", error);
                    showNotification('حدث خطأ أثناء الإضافة');
                }
            };

            const handleSendWhatsApp = async (beneficiary) => {
                const formattedPhone = formatPhoneNumber(beneficiary.phone);
                const message = encodeURIComponent(generateMessage(beneficiary.targetAssoc));
                
                // فتح الواتساب مباشرة
                window.open(`https://wa.me/${formattedPhone}?text=${message}`, '_blank');

                if (isFirebaseConfigured) {
                    try {
                        const docRef = doc(db, 'beneficiaries', beneficiary.id);
                        await updateDoc(docRef, {
                            status: 'sent',
                            sentAt: Date.now()
                        });
                    } catch (error) {
                        console.error("Error updating doc:", error);
                    }
                }
            };

            const handleDelete = async (id) => {
                if (!isFirebaseConfigured) return;
                if (window.confirm('هل أنت متأكد من حذف هذا المستفيد نهائياً؟')) {
                    try {
                        const docRef = doc(db, 'beneficiaries', id);
                        await deleteDoc(docRef);
                        showNotification('تم الحذف');
                    } catch (error) {
                        console.error("Error deleting doc:", error);
                    }
                }
            };

            if (!isUiAuthenticated) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-gray-50 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]">
                        <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border-t-4 border-brand-orange">
                            <div className="flex flex-col items-center mb-8">
                                <BrandLogo className="w-28 h-28 mb-4 drop-shadow-md" />
                                <h1 className="text-2xl font-bold text-gray-800 text-center">جمعية بناء وتنمية مساكن</h1>
                                <p className="text-sm mt-1 font-bold text-brand-green">بوابة إشعار المستفيدين</p>
                            </div>

                            <form onSubmit={handleLogin} className="space-y-5">
                                {loginError && (
                                    <div className="bg-red-50 text-red-600 p-3 rounded-lg text-sm text-center flex items-center justify-center">
                                        <AlertCircle className="w-4 h-4 ml-2" />
                                        {loginError}
                                    </div>
                                )}
                                
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-1.5">اسم المستخدم</label>
                                    <input 
                                        type="text" 
                                        value={loginUsername}
                                        onChange={(e) => setLoginUsername(e.target.value)}
                                        className="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-brand-orange focus:bg-white focus:outline-none transition-all"
                                        placeholder="أدخل اسم المستخدم"
                                        required dir="ltr"
                                    />
                                </div>
                                
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-1.5">كلمة المرور</label>
                                    <input 
                                        type="password" 
                                        value={loginPassword}
                                        onChange={(e) => setLoginPassword(e.target.value)}
                                        className="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-brand-orange focus:bg-white focus:outline-none transition-all"
                                        placeholder="••••••••"
                                        required dir="ltr"
                                    />
                                </div>

                                <button 
                                    type="submit"
                                    className="w-full text-white font-bold py-3 rounded-lg transition-all hover:opacity-90 flex items-center justify-center shadow-lg bg-brand-orange"
                                >
                                    <ShieldCheck className="w-5 h-5 ml-2" />
                                    تسجيل الدخول
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            const stats = {
                total: beneficiaries.length,
                sent: beneficiaries.filter(b => b.status === 'sent').length,
                pending: beneficiaries.filter(b => b.status === 'pending').length,
            };

            return (
                <div className="min-h-screen pb-12">
                    {notification && (
                        <div className="fixed bottom-6 left-6 bg-gray-900 text-white px-6 py-3 rounded-xl shadow-2xl flex items-center z-50 animate-bounce">
                            <CheckCircle className="w-5 h-5 ml-3 text-brand-green" />
                            {notification}
                        </div>
                    )}

                    {/* Header */}
                    <header className="bg-white shadow-sm border-b-4 border-brand-orange sticky top-0 z-40">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex items-center justify-between">
                            <div className="flex items-center space-x-4 space-x-reverse">
                                <BrandLogo className="w-14 h-14" />
                                <div>
                                    <h1 className="text-xl font-bold text-brand-gray">بوابة إشعار النقل</h1>
                                    <p className="text-xs font-bold flex items-center mt-1 text-brand-green">
                                        جمعية بناء وتنمية مساكن
                                        {isFirebaseConfigured ? (
                                            <span className="mr-2 flex h-2 w-2 relative" title="متصل بالسحابة">
                                                <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                                                <span className="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                                            </span>
                                        ) : (
                                            <span className="mr-2 text-red-500 flex items-center">
                                                <AlertCircle className="w-3 h-3 ml-1" /> غير متصل بقاعدة البيانات
                                            </span>
                                        )}
                                    </p>
                                </div>
                            </div>
                            
                            <button 
                                onClick={() => setIsUiAuthenticated(false)}
                                className="flex items-center px-4 py-2 text-sm font-bold text-red-600 bg-red-50 hover:bg-red-100 rounded-lg transition-colors"
                            >
                                <LogOut className="w-4 h-4 ml-2" />
                                خروج
                            </button>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        
                        {!isFirebaseConfigured && (
                            <div className="mb-8 bg-red-50 border border-red-200 text-red-700 px-6 py-4 rounded-xl flex items-start shadow-sm">
                                <AlertCircle className="w-6 h-6 ml-3 shrink-0 mt-0.5" />
                                <div>
                                    <h3 className="font-bold text-lg mb-1">النظام غير متصل بقاعدة البيانات!</h3>
                                    <p className="text-sm">أنت الآن تستخدم النظام بدون حفظ سحابي. لكي يتم حفظ الأسماء للوصول لها من الجوال أو أي كمبيوتر، يرجى تعديل ملف <code className="bg-white px-1 py-0.5 rounded border text-red-500" dir="ltr">index.html</code> وإضافة مفاتيح (Firebase) في السطر رقم 63.</p>
                                </div>
                            </div>
                        )}

                        {/* Stats */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                            <div className="bg-white rounded-xl shadow-sm p-6 border-r-4 border-brand-gray flex items-center space-x-4 space-x-reverse">
                                <div className="p-3 rounded-lg bg-gray-100">
                                    <FileText className="w-6 h-6 text-brand-gray" />
                                </div>
                                <div>
                                    <p className="text-sm text-gray-500 font-bold">إجمالي المستفيدين</p>
                                    <p className="text-3xl font-black text-gray-900 mt-1">{stats.total}</p>
                                </div>
                            </div>
                            
                            <div className="bg-white rounded-xl shadow-sm p-6 border-r-4 border-brand-green flex items-center space-x-4 space-x-reverse">
                                <div className="p-3 rounded-lg bg-green-50">
                                    <CheckCircle className="w-6 h-6 text-brand-green" />
                                </div>
                                <div>
                                    <p className="text-sm text-gray-500 font-bold">تم إرسال الواتساب</p>
                                    <p className="text-3xl font-black text-gray-900 mt-1">{stats.sent}</p>
                                </div>
                            </div>

                            <div className="bg-white rounded-xl shadow-sm p-6 border-r-4 border-brand-orange flex items-center space-x-4 space-x-reverse">
                                <div className="p-3 rounded-lg bg-orange-50">
                                    <MessageCircle className="w-6 h-6 text-brand-orange" />
                                </div>
                                <div>
                                    <p className="text-sm text-gray-500 font-bold">بانتظار الإرسال</p>
                                    <p className="text-3xl font-black text-gray-900 mt-1">{stats.pending}</p>
                                </div>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            
                            {/* Form */}
