<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مصمم بطاقات العمل - جمعية بناء</title>
    <!-- استيراد الخطوط -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <!-- مكتبة Tailwind CSS للتنسيق العام -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- مكتبة html2canvas لحفظ الصورة -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f0f2f5;
        }

        /* تنسيقات البطاقة المخصصة لضمان الدقة */
        .card-container {
            width: 350px;
            height: 580px;
            background-color: white;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: all 0.3s ease;
        }

        .header-shape {
            width: 160%;
            height: 240px;
            /* سيتم تغيير اللون عبر الجافاسكربت */
            background: var(--main-color, #0f172a); 
            border-bottom-left-radius: 50%;
            border-bottom-right-radius: 50%;
            position: absolute;
            top: -70px;
            z-index: 1;
            transition: background 0.3s;
        }

        .header-accent {
            width: 155%;
            height: 245px;
            background: var(--accent-color, #fbbf24);
            border-bottom-left-radius: 50%;
            border-bottom-right-radius: 50%;
            position: absolute;
            top: -75px;
            z-index: 0;
            opacity: 0.8;
            transition: background 0.3s;
        }

        .logo-box {
            width: 80px;
            height: 80px;
            background-color: white;
            border-radius: 12px;
            position: relative;
            z-index: 2;
            margin-top: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        /* تحسين عرض الشعار */
        .logo-placeholder-icon {
            color: #cbd5e1;
            width: 40px;
            height: 40px;
        }

        .logo-img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            display: none; /* مخفي افتراضياً حتى يتم الرفع */
        }

        .logo-img.active {
            display: block;
        }

        .logo-placeholder-icon.hidden {
            display: none;
        }

        .profile-box {
            width: 150px;
            height: 150px;
            background-color: #f1f5f9;
            border-radius: 50%;
            border: 6px solid white;
            position: relative;
            z-index: 2;
            margin-top: 20px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .info-area {
            margin-top: 25px;
            width: 100%;
            padding: 0 20px;
            z-index: 2;
        }

        .name-text {
            font-size: 26px;
            font-weight: 800;
            color: #1e293b;
            margin: 0;
        }

        .title-badge {
            display: inline-block;
            background-color: var(--accent-color, #fbbf24);
            color: #0f172a;
            padding: 5px 20px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 14px;
            margin-top: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .org-text {
            font-size: 15px;
            color: #64748b;
            line-height: 1.6;
            border-top: 1px dashed #cbd5e1;
            padding-top: 15px;
            margin-top: 5px;
        }

        .qr-area {
            margin-top: auto;
            margin-bottom: 30px;
            padding: 10px;
            background: white;
            border-radius: 10px;
            /* border: 1px solid #e2e8f0; */
        }

        .bottom-bar {
            width: 100%;
            height: 12px;
            background: var(--main-color, #0f172a);
            position: absolute;
            bottom: 0;
        }

        /* File Upload styling */
        .file-upload-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }
        
        .upload-btn {
            border: 2px dashed #cbd5e1;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            width: 100%;
            background: #f8fafc;
        }
        
        .upload-btn:hover {
            border-color: #3b82f6;
            background: #eff6ff;
            color: #3b82f6;
        }

        .hole-punch {
            width: 60px;
            height: 8px;
            background: rgba(255,255,255,0.25);
            position: absolute;
            top: 20px;
            border-radius: 10px;
            z-index: 10;
            left: 50%;
            transform: translateX(-50%);
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- لوحة التحكم (يمين) -->
        <div class="lg:col-span-4 bg-white p-6 rounded-2xl shadow-sm h-fit">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-4">⚙️ لوحة التعديل</h2>
            
            <div class="space-y-5">
                <!-- قسم البيانات الشخصية -->
                <div>
                    <h3 class="text-sm font-semibold text-gray-500 uppercase mb-3">البيانات</h3>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">الاسم</label>
                            <input type="text" id="inputName" value="محمد جازان" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">المسمى الوظيفي</label>
                            <input type="text" id="inputTitle" value="مدير تنفيذي" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">اسم الجمعية (السطر 1)</label>
                            <input type="text" id="inputOrg1" value="جمعية بناء وتنمية مساكن" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">المنطقة (السطر 2)</label>
                            <input type="text" id="inputOrg2" value="بمنطقة جازان" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>
                </div>

                <!-- قسم الصور -->
                <div>
                    <h3 class="text-sm font-semibold text-gray-500 uppercase mb-3 pt-4 border-t">الصور</h3>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">الصورة الشخصية</label>
                            <div class="file-upload-wrapper w-full">
                                <label for="uploadPhoto" class="upload-btn text-xs text-gray-600">
                                    <span id="photoFileName">اختر صورة...</span>
                                </label>
                                <input type="file" id="uploadPhoto" accept="image/*" class="hidden">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">الشعار (Logo)</label>
                            <div class="file-upload-wrapper w-full">
                                <label for="uploadLogo" class="upload-btn text-xs text-gray-600">
                                    <span id="logoFileName">اختر شعار...</span>
                                </label>
                                <input type="file" id="uploadLogo" accept="image/*" class="hidden">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- قسم الألوان -->
                <div>
                    <h3 class="text-sm font-semibold text-gray-500 uppercase mb-3 pt-4 border-t">الألوان</h3>
                    <div class="flex gap-4">
                        <div class="flex-1">
                            <label class="block text-sm font-medium text-gray-700 mb-1">اللون الأساسي</label>
                            <div class="flex items-center gap-2">
                                <input type="color" id="mainColorPicker" value="#0f172a" class="h-10 w-full rounded cursor-pointer">
                            </div>
                        </div>
                        <div class="flex-1">
                            <label class="block text-sm font-medium text-gray-700 mb-1">لون التمييز (ذهبي)</label>
                            <div class="flex items-center gap-2">
                                <input type="color" id="accentColorPicker" value="#fbbf24" class="h-10 w-full rounded cursor-pointer">
                            </div>
                        </div>
                    </div>
                </div>

                 <!-- قسم الباركود -->
                 <div>
                    <h3 class="text-sm font-semibold text-gray-500 uppercase mb-3 pt-4 border-t">الباركود (QR Code)</h3>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">رابط أو نص الباركود</label>
                        <input type="text" id="qrInput" value="https://jazanhousing.org.sa" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-left" dir="ltr">
                    </div>
                </div>

                <button onclick="downloadCard()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-xl shadow mt-6 flex items-center justify-center gap-2 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    حفظ البطاقة كصورة
                </button>
            </div>
        </div>

        <!-- منطقة المعاينة (يسار) -->
        <div class="lg:col-span-8 bg-gray-200 rounded-2xl flex flex-col items-center justify-center p-8 border-2 border-dashed border-gray-300 min-h-[600px]">
            <h3 class="text-gray-500 font-bold mb-4">معاينة البطاقة</h3>
            
            <!-- البطاقة -->
            <div id="cardPreview" class="card-container">
                <!-- الألوان الخلفية -->
                <div class="header-accent" id="accentBg"></div>
                <div class="header-shape" id="mainBg"></div>
                <div class="hole-punch"></div>

                <!-- الشعار -->
                <div class="logo-box">
                    <!-- أيقونة افتراضية SVG مضمنة لتجنب أخطاء التحميل -->
                    <svg id="logoPlaceholder" class="logo-placeholder-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                    </svg>
                    <!-- الصورة التي ستظهر عند الرفع -->
                    <img id="cardLogo" src="" class="logo-img" alt="Logo">
                </div>

                <!-- الصورة الشخصية -->
                <div class="profile-box">
                    <img id="cardPhoto" src="https://ui-avatars.com/api/?name=User&background=random&color=fff&size=256" class="profile-img" crossorigin="anonymous" alt="Profile">
                </div>

                <!-- المعلومات -->
                <div class="info-area">
                    <h2 class="name-text" id="cardName">محمد جازان</h2>
                    <span class="title-badge" id="cardTitle">مدير تنفيذي</span>
                    <div class="org-text">
                        <div id="cardOrg1" class="font-bold text-gray-700">جمعية بناء وتنمية مساكن</div>
                        <div id="cardOrg2">بمنطقة جازان</div>
                    </div>
                </div>

                <!-- الباركود -->
                <div class="qr-area">
                    <img id="cardQR" src="" alt="QR Code" width="80" height="80" crossorigin="anonymous">
                </div>

                <!-- الشريط السفلي -->
                <div class="bottom-bar" id="bottomBar"></div>
            </div>

            <p class="text-xs text-gray-500 mt-4">نصيحة: استخدم صور عالية الجودة لنتيجة أفضل عند الطباعة</p>
        </div>
    </div>

    <script>
        // دالة مساعدة للحصول على العناصر
        const get = (id) => document.getElementById(id);

        // عناصر الإدخال
        const inputName = get('inputName');
        const inputTitle = get('inputTitle');
        const inputOrg1 = get('inputOrg1');
        const inputOrg2 = get('inputOrg2');
        const mainColorPicker = get('mainColorPicker');
        const accentColorPicker = get('accentColorPicker');
        const qrInput = get('qrInput');
        const uploadPhoto = get('uploadPhoto');
        const uploadLogo = get('uploadLogo');

        // عناصر البطاقة
        const cardName = get('cardName');
        const cardTitle = get('cardTitle');
        const cardOrg1 = get('cardOrg1');
        const cardOrg2 = get('cardOrg2');
        const cardContainer = get('cardPreview');
        const cardQR = get('cardQR');
        const cardPhoto = get('cardPhoto');
        const cardLogo = get('cardLogo');
        const logoPlaceholder = get('logoPlaceholder');

        // تحديث النصوص
        function updateText() {
            cardName.innerText = inputName.value;
            cardTitle.innerText = inputTitle.value;
            cardOrg1.innerText = inputOrg1.value;
            cardOrg2.innerText = inputOrg2.value;
        }

        // تحديث الألوان
        function updateColors() {
            const main = mainColorPicker.value;
            const accent = accentColorPicker.value;
            
            // استخدام CSS Variables للتحديث السلس
            cardContainer.style.setProperty('--main-color', main);
            cardContainer.style.setProperty('--accent-color', accent);
        }

        // تحديث الباركود
        function updateQR() {
            const data = qrInput.value || "Empty";
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(data)}`;
            cardQR.src = qrUrl;
        }

        // معالجة رفع الصور
        function handleImageUpload(input, imgElement, labelElementId, isLogo = false) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imgElement.src = e.target.result;
                    
                    // إذا كان شعارًا، قم بإظهار الصورة وإخفاء الرمز
                    if(isLogo) {
                        imgElement.classList.add('active');
                        logoPlaceholder.classList.add('hidden');
                    }
                }
                reader.readAsDataURL(input.files[0]);
                
                // تحديث نص الزر
                if(labelElementId) {
                    document.getElementById(labelElementId).innerText = input.files[0].name;
                    document.getElementById(labelElementId).parentElement.style.borderColor = "#3b82f6";
                    document.getElementById(labelElementId).parentElement.style.color = "#3b82f6";
                }
            }
        }

        // ربط الأحداث (Event Listeners)
        inputName.addEventListener('input', updateText);
        inputTitle.addEventListener('input', updateText);
        inputOrg1.addEventListener('input', updateText);
        inputOrg2.addEventListener('input', updateText);
        
        mainColorPicker.addEventListener('input', updateColors);
        accentColorPicker.addEventListener('input', updateColors);
        
        qrInput.addEventListener('input', updateQR);

        uploadPhoto.addEventListener('change', function() {
            handleImageUpload(this, cardPhoto, 'photoFileName');
        });

        uploadLogo.addEventListener('change', function() {
            handleImageUpload(this, cardLogo, 'logoFileName', true);
        });

        // دالة التحميل
        function downloadCard() {
            const card = document.getElementById('cardPreview');
            
            // تحسين جودة الصورة عند الحفظ
            html2canvas(card, {
                scale: 3, // دقة عالية
                useCORS: true, // للسماح بتحميل صور خارجية إن وجدت
                backgroundColor: null,
                logging: false // إيقاف السجلات المزعجة في الكونسول
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `بطاقة-${inputName.value}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        // التهيئة الأولية
        updateQR();
        updateColors();
    </script>
</body>
</html>
