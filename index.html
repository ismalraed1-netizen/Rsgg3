<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بطاقة هوية - جمعية بناء وتنمية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --c-green: #84BD00;
            --c-orange: #F05A28;
            --c-grey: #9C9E9F;
            --c-dark: #1e293b;
        }

        body { font-family: 'Tajawal', sans-serif; background-color: #f1f5f9; user-select: none; overflow-x: hidden; }

        /* منطقة العمل (Canvas Area) */
        .canvas-area {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto;
            padding: 40px;
            background-color: #e5e7eb;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
            border-radius: 20px;
            position: relative;
        }

        /* حاوية البطاقة */
        .card-wrapper {
            width: 340px; height: 535px; /* المقاس الافتراضي */
            position: relative;
            background: white; overflow: hidden; border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2); 
            transition: width 0.3s, height 0.3s, transform 0.2s ease;
            transform-origin: center top;
        }
        
        /* عناصر الخلفية */
        .bg-shape { position: absolute; z-index: 0; transition: all 0.4s ease; }
        .card-wrapper .bottom-bar { position: absolute; bottom: 0; width: 100%; height: 10px; background: var(--c-green); z-index: 1; }

        /* --- الأنماط --- */
        /* 1. الرسمي */
        .t-official .bg-1 { top: -20%; left: -20%; width: 140%; height: 50%; background: var(--c-green); border-radius: 0 0 50% 50%; }
        .t-official .bg-2 { top: -22%; left: -10%; width: 120%; height: 50%; background: var(--c-orange); border-radius: 0 0 50% 50%; }

        /* 2. الهندسي */
        .t-geo .bg-1 { top: 0; left: 0; width: 100%; height: 40%; background: var(--c-green); clip-path: polygon(0 0, 100% 0, 100% 60%, 0 100%); }
        .t-geo .bg-2 { top: 0; left: 0; width: 100%; height: 42%; background: var(--c-orange); clip-path: polygon(0 0, 100% 0, 100% 65%, 0 100%); opacity: 0.7; }

        /* 3. الجانبي */
        .t-side .bg-1 { top: 0; right: 0; width: 15%; height: 100%; background: linear-gradient(to bottom, var(--c-green), var(--c-green) 50%, var(--c-orange) 50%); }
        .t-side .bottom-bar { display: none; }
        .t-side .info-container { padding-right: 15%; }

        /* 4. المائل */
        .t-diag .bg-1 { top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(115deg, var(--c-green) 0%, var(--c-green) 35%, transparent 35.1%); }
        .t-diag .bottom-bar { display: none; }
        
        /* 5. الشركات */
        .t-corp .bg-1 { top: 0; left: 0; width: 100%; height: 3%; background: var(--c-orange); }
        .t-corp .bg-2 { top: 3%; left: 0; width: 100%; height: 18%; background: var(--c-green); border-radius: 0 0 40px 0; }
        .t-corp .bottom-bar { height: 5%; background: var(--c-grey); }

        /* 6. الدوائر */
        .t-circ .bg-1 { top: -15%; right: -25%; width: 80%; padding-top: 80%; background: var(--c-green); border-radius: 50%; opacity: 0.1; }
        .t-circ .bg-2 { bottom: -10%; left: -15%; width: 60%; padding-top: 60%; background: var(--c-orange); border-radius: 50%; opacity: 0.1; }
        .t-circ .bg-3 { top: 5%; left: 50%; transform: translateX(-50%); width: 80%; height: 1%; background: var(--c-green); border-radius: 10px; }

        /* 7. إطار */
        .t-min .bg-1 { top: 5%; left: 5%; right: 5%; bottom: 5%; border: 2px solid var(--c-green); border-radius: 16px; pointer-events: none; }
        .t-min .bottom-bar { display: none; }

        /* 8. تباين */
        .t-cont .bg-1 { bottom: 0; left: 0; width: 100%; height: 35%; background: var(--c-green); clip-path: polygon(0 20%, 100% 0, 100% 100%, 0% 100%); }
        .t-cont .bottom-bar { display: none; }


        /* --- العناصر المتحركة --- */
        .draggable { position: absolute; z-index: 10; cursor: move; display: flex; justify-content: center; align-items: center; }
        .draggable:hover { outline: 1px dashed rgba(0,0,0,0.3); }

        .logo-box { left: 50%; transform: translateX(-50%); top: 8%; width: 45%; }
        .logo-img { width: 100%; height: auto; pointer-events: none; display: block; }
        .logo-box.is-circle { width: 35%; aspect-ratio: 1/1; background: white; border-radius: 50%; box-shadow: 0 5px 15px rgba(0,0,0,0.1); overflow: hidden; padding: 3%; }
        .logo-box.is-circle .logo-img { width: 100%; height: 100%; object-fit: contain; }

        .profile-box { left: 50%; transform: translateX(-50%); top: 28%; width: 40%; aspect-ratio: 1/1; border-radius: 50%; border: 5px solid white; box-shadow: 0 8px 20px rgba(0,0,0,0.1); background: #f1f5f9; overflow: hidden; }
        .profile-img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }

        .qr-box { bottom: 6%; left: 50%; transform: translateX(-50%); width: 22%; aspect-ratio: 1/1; background: white; border-radius: 8px; padding: 1.5%; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .qr-img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }

        .info-container { position: absolute; bottom: 22%; width: 100%; text-align: center; z-index: 5; pointer-events: none; }
        .name-text { font-size: 26px; font-weight: 800; color: var(--c-dark); margin-bottom: 1%; }
        .role-badge { display: inline-block; background: var(--c-orange); color: white; padding: 1% 6%; border-radius: 50px; font-weight: 700; font-size: 14px; margin-bottom: 2%; }
        .org-text { font-size: 14px; color: var(--c-grey); font-weight: 600; line-height: 1.5; }

        /* التحكم */
        .float-ctrl { position: absolute; top: -30px; left: 50%; transform: translateX(-50%); background: #333; padding: 2px 6px; border-radius: 20px; display: flex; gap: 4px; opacity: 0; transition: 0.2s; pointer-events: auto; }
        .draggable:hover .float-ctrl, .draggable:active .float-ctrl { opacity: 1; }
        .mini-btn { width: 20px; height: 20px; border-radius: 50%; border: 1px solid #555; background: #444; color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; }
        .mini-btn:hover { background: #555; }
        
        .theme-btn { @apply border rounded-xl p-2 hover:bg-green-50 transition flex flex-col items-center gap-1 text-[10px] font-bold text-gray-600; }
        .theme-btn.active { @apply ring-2 ring-green-500 bg-green-50; }
        .theme-preview { width: 100%; height: 35px; background: #f3f4f6; border-radius: 6px; position: relative; overflow: hidden; }
        
        /* عناصر التحكم في الزووم */
        .zoom-slider-container {
            position: absolute; bottom: 20px; right: 20px;
            background: white; padding: 10px; border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); z-index: 50;
            display: flex; align-items: center; gap: 10px;
        }
    </style>
</head>
<body class="p-4 md:p-8 h-screen flex flex-col">

    <div class="max-w-full mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6 h-full">
        
        <!-- لوحة التحكم (ثابتة) -->
        <div class="lg:col-span-3 bg-white p-5 rounded-3xl shadow-lg flex flex-col gap-4 overflow-y-auto h-full">
            <div class="border-b pb-3">
                <h1 class="text-xl font-black text-gray-800">إعدادات الهوية</h1>
                <p class="text-xs text-gray-500">الإصدار 15: تحكم كامل بالمقاسات</p>
            </div>

            <!-- مقاس البطاقة -->
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-2">مقاس البطاقة:</label>
                <select id="cardSizeSelect" onchange="changeCardSize()" class="w-full p-2 text-xs border rounded-lg bg-gray-50">
                    <option value="id1">قياسي (ID-1) - 5.4cm x 8.6cm</option>
                    <option value="biz">بزنس كارد - 9cm x 5cm</option>
                    <option value="sq">مربع (انستقرام) - 10cm x 10cm</option>
                </select>
            </div>

            <!-- القوالب -->
            <div class="flex-1 overflow-y-auto">
                <label class="block text-xs font-bold text-gray-700 mb-2">القوالب:</label>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="setTheme('t-official', this)" class="theme-btn active"><div class="theme-preview"><div class="absolute top-0 left-0 w-full h-4 bg-[#84BD00] rounded-b-full"></div></div>رسمي</button>
                    <button onclick="setTheme('t-geo', this)" class="theme-btn"><div class="theme-preview"><div class="absolute top-0 left-0 w-full h-full bg-[#84BD00]" style="clip-path: polygon(0 0, 100% 0, 0 100%)"></div></div>هندسي</button>
                    <button onclick="setTheme('t-side', this)" class="theme-btn"><div class="theme-preview"><div class="absolute right-0 h-full w-2 bg-[#84BD00]"></div></div>جانبي</button>
                    <button onclick="setTheme('t-diag', this)" class="theme-btn"><div class="theme-preview"><div class="absolute top-0 left-0 h-full w-1/2 bg-[#84BD00] -skew-x-12"></div></div>مائل</button>
                    <button onclick="setTheme('t-corp', this)" class="theme-btn"><div class="theme-preview"><div class="absolute top-0 w-full h-2 bg-[#84BD00]"></div><div class="absolute top-0 w-full h-1 bg-[#F05A28]"></div></div>شركات</button>
                    <button onclick="setTheme('t-circ', this)" class="theme-btn"><div class="theme-preview"><div class="absolute -top-2 -right-2 w-6 h-6 bg-[#84BD00] rounded-full opacity-50"></div></div>دوائر</button>
                    <button onclick="setTheme('t-min', this)" class="theme-btn"><div class="theme-preview border border-[#84BD00] m-1 rounded"></div>إطار</button>
                    <button onclick="setTheme('t-cont', this)" class="theme-btn"><div class="theme-preview"><div class="absolute bottom-0 w-full h-3 bg-[#84BD00]"></div></div>تباين</button>
                </div>
            </div>

            <!-- الملفات -->
            <div class="border-t pt-3">
                <div class="grid grid-cols-2 gap-2 mb-2">
                    <button onclick="get('uplLogo').click()" class="py-2 border rounded-lg text-[10px] font-bold hover:bg-gray-50">🏢 الشعار</button>
                    <button onclick="get('uplPhoto').click()" class="py-2 border rounded-lg text-[10px] font-bold hover:bg-gray-50">👤 الصورة</button>
                </div>
                <button onclick="toggleLogoShape()" class="w-full py-1 text-[10px] text-green-600 font-bold hover:underline mb-2">🔄 تغيير شكل الشعار (دائري/حر)</button>
                
                <div class="flex gap-2 items-center bg-gray-50 p-2 rounded-lg border mb-2">
                    <input type="text" id="qrText" class="flex-1 bg-transparent text-[10px] outline-none" placeholder="رابط الباركود">
                    <button onclick="get('uplQR').click()" class="text-[10px] font-bold text-blue-600 hover:text-blue-800">📷 صورة</button>
                </div>
            </div>

            <!-- البيانات -->
            <div class="space-y-2">
                <input type="text" id="inpName" value="أحمد محمد" class="w-full p-2 border rounded-lg text-xs" placeholder="الاسم">
                <input type="text" id="inpRole" value="المدير العام" class="w-full p-2 border rounded-lg text-xs" placeholder="المسمى">
            </div>

            <button onclick="downloadCard()" class="w-full bg-[#84BD00] hover:bg-[#73a500] text-white font-bold py-3 rounded-xl shadow-lg mt-auto text-sm">
                💾 حفظ البطاقة
            </button>

            <input type="file" id="uplLogo" accept="image/*" class="hidden">
            <input type="file" id="uplPhoto" accept="image/*" class="hidden">
            <input type="file" id="uplQR" accept="image/*" class="hidden">
        </div>

        <!-- منطقة العمل (Canvas) -->
        <div class="lg:col-span-9 h-full relative">
            <div class="canvas-area">
                
                <div id="cardCanvas" class="card-wrapper t-official">
                    <!-- الخلفية -->
                    <div class="bg-shape bg-1"></div>
                    <div class="bg-shape bg-2"></div>
                    <div class="bg-shape bg-3"></div>
                    <div class="bottom-bar"></div>

                    <!-- العناصر -->
                    <div id="boxLogo" class="draggable logo-box">
                        <div class="float-ctrl"><div class="mini-btn" onclick="resize('boxLogo', 5)">+</div><div class="mini-btn" onclick="resize('boxLogo', -5)">-</div></div>
                        <div id="logoPlace" class="w-full h-full min-h-[50px] border-2 border-dashed border-gray-300 rounded flex items-center justify-center text-[10px] text-gray-400 bg-white/80">الشعار</div>
                        <img id="imgLogo" src="" class="logo-img hidden">
                    </div>

                    <div id="boxProfile" class="draggable profile-box">
                        <div class="float-ctrl"><div class="mini-btn" onclick="resize('boxProfile', 5)">+</div><div class="mini-btn" onclick="resize('boxProfile', -5)">-</div></div>
                        <img id="imgProfile" src="https://ui-avatars.com/api/?name=%D8%A3+%D9%85&background=f1f5f9&color=94a3b8&size=256&font-size=0.4" class="profile-img">
                    </div>

                    <div class="info-container">
                        <h2 class="name-text" id="txtName">أحمد محمد</h2>
                        <span class="role-badge" id="txtRole">المدير العام</span>
                        <div class="org-text"><div>جمعية بناء وتنمية مساكن</div><div>بمنطقة جازان</div></div>
                    </div>

                    <div id="boxQR" class="draggable qr-box">
                        <div class="float-ctrl"><div class="mini-btn" onclick="resize('boxQR', 5)">+</div><div class="mini-btn" onclick="resize('boxQR', -5)">-</div></div>
                        <img id="imgQR" src="" class="qr-img">
                    </div>
                </div>

            </div>

            <!-- أزرار الزووم العائمة -->
            <div class="zoom-slider-container">
                <span class="text-xs font-bold text-gray-500">تكبير العرض:</span>
                <button onclick="zoomCard(-0.1)" class="w-6 h-6 bg-gray-200 rounded text-gray-700 font-bold hover:bg-gray-300">-</button>
                <span id="zoomDisplay" class="text-xs font-bold w-8 text-center">100%</span>
                <button onclick="zoomCard(0.1)" class="w-6 h-6 bg-gray-200 rounded text-gray-700 font-bold hover:bg-gray-300">+</button>
            </div>
        </div>
    </div>

    <script>
        const get = id => document.getElementById(id);
        const card = get('cardCanvas');
        
        // --- التحكم في زووم العرض (Canvas Zoom) ---
        let currentZoom = 1;
        function zoomCard(delta) {
            currentZoom = Math.min(Math.max(0.5, currentZoom + delta), 2);
            card.style.transform = `scale(${currentZoom})`;
            get('zoomDisplay').innerText = Math.round(currentZoom * 100) + '%';
        }

        // --- تغيير مقاس البطاقة ---
        function changeCardSize() {
            const size = get('cardSizeSelect').value;
            if (size === 'id1') { card.style.width = '340px'; card.style.height = '535px'; } // 5.4x8.6
            else if (size === 'biz') { card.style.width = '500px'; card.style.height = '280px'; } // 9x5 (Landscape)
            else if (size === 'sq') { card.style.width = '400px'; card.style.height = '400px'; } // 10x10
        }

        // --- الوظائف الأساسية ---
        function setTheme(cls, btn) {
            card.className = `card-wrapper ${cls}`;
            document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
        }

        let isCircle = false;
        function toggleLogoShape() {
            isCircle = !isCircle;
            get('boxLogo').classList.toggle('is-circle', isCircle);
        }

        ['inpName', 'inpRole'].forEach(id => {
            get(id).oninput = () => {
                get('txtName').innerText = get('inpName').value;
                get('txtRole').innerText = get('inpRole').value;
            }
        });

        const updateAutoQR = () => {
            if(!get('imgQR').getAttribute('data-custom')) {
                const url = get('qrText').value || "https://bena-jazan.sa";
                get('imgQR').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(url)}`;
            }
        };
        get('qrText').oninput = updateAutoQR;

        function makeDraggable(el) {
            let isDragging = false, startX, startY, initLeft, initTop;
            const start = (cx, cy) => { isDragging = true; startX = cx; startY = cy; initLeft = el.offsetLeft; initTop = el.offsetTop; el.style.cursor = 'grabbing'; };
            const move = (cx, cy) => { if(!isDragging) return; el.style.left = (initLeft + (cx - startX)) + 'px'; el.style.top = (initTop + (cy - startY)) + 'px'; el.style.transform = 'none'; };
            const end = () => { isDragging = false; el.style.cursor = 'move'; };
            el.addEventListener('mousedown', e => { if(!e.target.classList.contains('mini-btn')) start(e.clientX, e.clientY); });
            window.addEventListener('mousemove', e => move(e.clientX, e.clientY));
            window.addEventListener('mouseup', end);
            el.addEventListener('touchstart', e => { if(!e.target.classList.contains('mini-btn')) start(e.touches[0].clientX, e.touches[0].clientY); });
            window.addEventListener('touchmove', e => move(e.touches[0].clientX, e.touches[0].clientY));
            window.addEventListener('touchend', end);
        }
        makeDraggable(get('boxLogo')); makeDraggable(get('boxProfile')); makeDraggable(get('boxQR'));

        window.resize = (id, delta) => {
            const el = get(id);
            const w = parseInt(getComputedStyle(el).width);
            el.style.width = (w + delta) + 'px';
            if(id !== 'boxLogo' || el.classList.contains('is-circle')) el.style.height = 'auto';
        };

        const handleUpload = (input, imgId, type) => {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = get(imgId); img.src = e.target.result;
                    if(type === 'logo') { img.classList.remove('hidden'); get('logoPlace').style.display = 'none'; }
                    if(type === 'qr') img.setAttribute('data-custom', 'true');
                };
                reader.readAsDataURL(input.files[0]);
            }
        };
        get('uplLogo').onchange = function() { handleUpload(this, 'imgLogo', 'logo'); };
        get('uplPhoto').onchange = function() { handleUpload(this, 'imgProfile', 'photo'); };
        get('uplQR').onchange = function() { handleUpload(this, 'imgQR', 'qr'); };

        function downloadCard() {
            // إعادة الزووم إلى 1 مؤقتاً للحصول على دقة عالية عند الحفظ
            const oldTransform = card.style.transform;
            card.style.transform = 'scale(1)';
            html2canvas(card, { scale: 3, useCORS: true, backgroundColor: null }).then(canvas => {
                const a = document.createElement('a');
                a.download = `Card-${get('inpName').value}.png`;
                a.href = canvas.toDataURL('image/png');
                a.click();
                card.style.transform = oldTransform; // استعادة الزووم
            });
        }

        updateAutoQR();
    </script>
</body>
</html>
