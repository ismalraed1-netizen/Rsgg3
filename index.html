<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام التقييم - جمعية بناء وتنمية</title>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <!-- Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #F9FAF9;
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.5s ease-out;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        // --- Constants & Config ---
        const { useState, useEffect, useMemo } = React;

        const COLORS = {
            primary: '#81B740', 
            secondary: '#EC7D21', 
            text: '#333333',
            lightBg: '#F9FAF9',
            white: '#FFFFFF',
            grey: '#9FA1A1',
            error: '#EF4444',
            success: '#10B981',
            warning: '#F59E0B'
        };

        const EMPLOYEES = [
            { id: 1, name: 'أحمد محمد', role: 'موظف استقبال' },
            { id: 2, name: 'سارة العلي', role: 'خدمة مستفيدين' },
            { id: 3, name: 'خالد عبدالله', role: 'علاقات عامة' },
        ];

        const RATING_CRITERIA = [
            { id: 'reception', label: 'حسن الاستقبال' },
            { id: 'speed', label: 'سرعة الإنجاز' },
            { id: 'knowledge', label: 'الإلمام بالمعلومة' },
        ];

        // --- Utility: Normalize Arabic Numbers ---
        const normalizeArabicNumbers = (str) => {
            return str.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
        };

        // --- Firebase Initialization ---
        let app, auth, db, appId;
        
        try {
            const firebaseConfig = typeof __firebase_config !== 'undefined' 
                ? JSON.parse(__firebase_config) 
                : { apiKey: "demo", authDomain: "demo.firebaseapp.com", projectId: "demo" };

            if (!firebase.apps.length) {
                app = firebase.initializeApp(firebaseConfig);
            } else {
                app = firebase.app();
            }
            
            auth = firebase.auth();
            db = firebase.firestore();
            appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        } catch (e) {
            console.error("Firebase Init Error:", e);
        }

        // --- Icon Components (SVG) ---
        const Icon = ({ path, size = 24, className = "", fill = "none", stroke = "currentColor" }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width={size} 
                height={size} 
                viewBox="0 0 24 24" 
                fill={fill} 
                stroke={stroke} 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round" 
                className={className}
            >
                {path}
            </svg>
        );

        const Icons = {
            Star: (props) => <Icon path={<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>} {...props} />,
            User: (props) => <Icon path={<><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></>} {...props} />,
            MessageSquare: (props) => <Icon path={<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>} {...props} />,
            Send: (props) => <Icon path={<><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></>} {...props} />,
            CheckCircle: (props) => <Icon path={<><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></>} {...props} />,
            Phone: (props) => <Icon path={<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>} {...props} />,
            Globe: (props) => <Icon path={<><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></>} {...props} />,
            Mail: (props) => <Icon path={<><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></>} {...props} />,
            ArrowRight: (props) => <Icon path={<><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></>} {...props} />,
            UserCheck: (props) => <Icon path={<><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><polyline points="17 11 19 13 23 9"></polyline></>} {...props} />,
            Smartphone: (props) => <Icon path={<><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></>} {...props} />,
            Lock: (props) => <Icon path={<><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></>} {...props} />,
            LayoutDashboard: (props) => <Icon path={<><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></>} {...props} />,
            LogOut: (props) => <Icon path={<><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></>} {...props} />,
            TrendingUp: (props) => <Icon path={<polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>} {...props} />,
            Users: (props) => <Icon path={<><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></>} {...props} />,
            List: (props) => <Icon path={<><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></>} {...props} />,
            AlertCircle: (props) => <Icon path={<><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></>} {...props} />,
            Loader: (props) => <Icon path={<><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></>} className="animate-spin" {...props} />
        };

        // --- Components ---

        function AdminLogin({ onBack, onSuccess }) {
            const [password, setPassword] = useState('');
            return (
                <div className="min-h-screen flex items-center justify-center bg-gray-100 p-4 font-cairo" dir="rtl">
                    <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm text-center">
                        <div className="w-16 h-16 bg-gray-800 text-white rounded-full flex items-center justify-center mx-auto mb-4">
                            <Icons.Lock size={30} />
                        </div>
                        <h2 className="text-2xl font-bold mb-6 text-gray-800">الدخول للإدارة</h2>
                        <form onSubmit={(e) => { e.preventDefault(); password === '1234' ? onSuccess() : alert('كلمة المرور خطأ'); }}>
                            <input 
                                type="password" 
                                placeholder="أدخل الرمز السري" 
                                className="w-full p-3 border rounded-xl mb-4 text-center text-lg focus:border-green-500 focus:ring-2 focus:ring-green-100 outline-none" 
                                value={password} 
                                onChange={(e) => setPassword(e.target.value)} 
                            />
                            <button type="submit" className="w-full py-3 rounded-xl bg-gray-800 text-white font-bold mb-3 hover:bg-gray-700 transition-colors">دخول</button>
                            <button type="button" onClick={onBack} className="text-gray-500 text-sm hover:underline">العودة للموقع</button>
                        </form>
                    </div>
                </div>
            );
        }

        function AdminDashboard({ user, onLogout }) {
            const [data, setData] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                if (!user) return;
                
                const ratingsRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('bena_ratings');
                
                const unsubscribe = ratingsRef.orderBy('createdAt', 'desc').onSnapshot((snapshot) => {
                    const fetchedData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setData(fetchedData);
                    setLoading(false);
                }, (err) => console.error(err));

                return () => unsubscribe();
            }, [user]);

            const stats = useMemo(() => {
                const total = data.length;
                const avg = total > 0 ? (data.reduce((acc, curr) => acc + (curr.averageScore || 0), 0) / total).toFixed(1) : 0;
                const empScores = {};
                data.forEach(d => {
                    if(!empScores[d.employeeName]) empScores[d.employeeName] = { total: 0, count: 0 };
                    empScores[d.employeeName].total += d.averageScore;
                    empScores[d.employeeName].count += 1;
                });
                let bestEmp = '-', maxAvg = 0;
                Object.entries(empScores).forEach(([name, val]) => {
                    if((val.total / val.count) > maxAvg) { maxAvg = val.total / val.count; bestEmp = name; }
                });
                return { total, avg, bestEmp };
            }, [data]);

            return (
                <div className="min-h-screen bg-gray-50 font-cairo text-right" dir="rtl">
                    <nav className="bg-gray-800 text-white p-4 shadow-lg sticky top-0 z-20">
                        <div className="container mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-2">
                                <img src="https://placehold.co/50x50/81B740/ffffff?text=L" alt="شعار" className="w-8 h-8 rounded bg-white" />
                                <h1 className="font-bold text-lg">لوحة التحكم</h1>
                            </div>
                            <button onClick={onLogout} className="flex items-center gap-2 bg-gray-700 px-4 py-2 rounded-lg hover:bg-red-500 text-sm transition-colors">
                                خروج <Icons.LogOut size={16} />
                            </button>
                        </div>
                    </nav>
                    <div className="container mx-auto p-4 md:p-8">
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                            <div className="bg-white p-6 rounded-2xl shadow-sm border-r-4 border-blue-500 flex justify-between">
                                <div><p className="text-gray-500 text-sm">العدد الكلي</p><h3 className="text-3xl font-bold mt-1">{stats.total}</h3></div>
                                <div className="bg-blue-50 p-3 rounded-full text-blue-500"><Icons.List size={24}/></div>
                            </div>
                            <div className="bg-white p-6 rounded-2xl shadow-sm border-r-4 border-green-500 flex justify-between">
                                <div><p className="text-gray-500 text-sm">متوسط الرضا</p><h3 className="text-3xl font-bold mt-1">{stats.avg}</h3></div>
                                <div className="bg-green-50 p-3 rounded-full text-green-500"><Icons.TrendingUp size={24}/></div>
                            </div>
                            <div className="bg-white p-6 rounded-2xl shadow-sm border-r-4 border-orange-500 flex justify-between">
                                <div><p className="text-gray-500 text-sm">الأفضل أداءً</p><h3 className="text-xl font-bold mt-2 truncate max-w-[150px]">{stats.bestEmp}</h3></div>
                                <div className="bg-orange-50 p-3 rounded-full text-orange-500"><Icons.Users size={24}/></div>
                            </div>
                        </div>
                        <div className="bg-white rounded-2xl shadow-lg overflow-hidden">
                            <div className="p-6 border-b"><h2 className="text-xl font-bold">سجل التقييمات</h2></div>
                            {loading ? <div className="p-8 text-center text-gray-500">جاري التحميل...</div> :
                            <div className="overflow-x-auto">
                                <table className="w-full text-right">
                                    <thead className="bg-gray-50 text-gray-500 text-xs">
                                        <tr>
                                            <th className="px-6 py-4">التاريخ</th>
                                            <th className="px-6 py-4">المستفيد</th>
                                            <th className="px-6 py-4">الجوال</th>
                                            <th className="px-6 py-4">الموظف</th>
                                            <th className="px-6 py-4">التقييم</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y text-sm">
                                        {data.map(i => (
                                            <tr key={i.id} className="hover:bg-gray-50">
                                                <td className="px-6 py-4 text-gray-400">
                                                    {i.createdAt?.seconds ? new Date(i.createdAt.seconds*1000).toLocaleDateString('ar-SA') : '-'}
                                                </td>
                                                <td className="px-6 py-4 font-semibold">{i.beneficiaryName}</td>
                                                <td className="px-6 py-4 font-mono">{i.beneficiaryPhone}</td>
                                                <td className="px-6 py-4">{i.employeeName}</td>
                                                <td className="px-6 py-4"><span className="font-bold text-yellow-600">{i.averageScore.toFixed(1)}</span></td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>}
                        </div>
                    </div>
                </div>
            );
        }

        function UserEvaluationForm({ user, onAdminRequest }) {
            const [step, setStep] = useState(1);
            const [beneficiary, setBeneficiary] = useState({ name: '', phone: '' });
            const [selectedEmployee, setSelectedEmployee] = useState(null);
            const [ratings, setRatings] = useState({});
            const [comment, setComment] = useState('');
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [isChecking, setIsChecking] = useState(false); 
            const [errors, setErrors] = useState({});
            const [dailyError, setDailyError] = useState(null);

            const validateBeneficiary = () => {
                const newErrors = {};
                // Normalize phone for validation (convert Arabic digits if present)
                const normalizedPhone = normalizeArabicNumbers(beneficiary.phone.trim());
                
                if (!beneficiary.name.trim()) newErrors.name = 'الرجاء إدخال الاسم';
                if (!normalizedPhone) newErrors.phone = 'الرجاء إدخال رقم الجوال';
                else if (!/^05\d{8}$/.test(normalizedPhone)) newErrors.phone = 'رقم الجوال يجب أن يبدأ بـ 05 ويتكون من 10 أرقام';
                
                // Update beneficiary with normalized phone if valid-ish
                if (normalizedPhone !== beneficiary.phone) {
                    setBeneficiary(prev => ({ ...prev, phone: normalizedPhone }));
                }

                setErrors(newErrors);
                return Object.keys(newErrors).length === 0;
            };

            const checkDailyLimitAndProceed = async () => {
                // If auth is not ready yet, show an alert
                if (!user) {
                    alert('جاري الاتصال بالنظام، الرجاء الانتظار لحظة والمحاولة مرة أخرى...');
                    return;
                }

                setDailyError(null);
                
                if (validateBeneficiary()) {
                    setIsChecking(true);
                    try {
                        const ratingsRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('bena_ratings');
                        
                        // Query for phone number
                        const snapshot = await ratingsRef.where('beneficiaryPhone', '==', beneficiary.phone).get();
                        
                        const todayStr = new Date().toDateString();
                        const hasRatedToday = snapshot.docs.some(doc => {
                            const data = doc.data();
                            const recordDate = data.createdAt?.toDate();
                            return recordDate && recordDate.toDateString() === todayStr;
                        });

                        if (hasRatedToday) {
                            setDailyError('عذراً، لقد قمت بإرسال تقييم اليوم مسبقاً. نتشرف بخدمتك مرة أخرى غداً.');
                        } else {
                            setStep(2);
                        }
                    } catch (error) {
                        console.error("Error checking daily limit:", error);
                        // If it's a permission error or similar, just let them proceed in test mode, or show friendly error
                        if (error.code === 'permission-denied') {
                             // Fallback for safety
                             setStep(2);
                        } else {
                             alert("حدث خطأ في الاتصال، يرجى المحاولة مرة أخرى.");
                        }
                    } finally {
                        setIsChecking(false);
                    }
                }
            };

            const handleRatingChange = (criteriaId, value) => {
                setRatings(prev => ({ ...prev, [criteriaId]: value }));
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!user) return;
                setIsSubmitting(true);

                try {
                    const scores = Object.values(ratings);
                    const avg = scores.reduce((a, b) => a + b, 0) / scores.length || 0;

                    const ratingsRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('bena_ratings');
                    
                    await ratingsRef.add({
                        beneficiaryName: beneficiary.name,
                        beneficiaryPhone: beneficiary.phone,
                        employeeId: selectedEmployee.id,
                        employeeName: selectedEmployee.name,
                        ratings: ratings,
                        averageScore: avg,
                        comment: comment,
                        createdAt: firebase.firestore.Timestamp.now()
                    });

                    setStep(4);
                } catch (error) {
                    console.error("Error adding document: ", error);
                    alert("حدث خطأ أثناء الإرسال");
                } finally {
                    setIsSubmitting(false);
                }
            };

            const resetForm = () => {
                setStep(1);
                setSelectedEmployee(null);
                setRatings({});
                setComment('');
                setBeneficiary({ name: '', phone: '' });
                setErrors({});
                setDailyError(null);
            };

            return (
                <div className="min-h-screen flex flex-col font-cairo bg-gray-50 text-right" dir="rtl">
                    {/* Header */}
                    <header className="bg-white shadow-sm p-4 sticky top-0 z-10 border-b-4" style={{ borderColor: COLORS.primary }}>
                        <div className="container mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <img 
                                    src="https://placehold.co/150x150/81B740/ffffff?text=LOGO" 
                                    alt="شعار الجمعية" 
                                    className="w-16 h-16 object-contain rounded-lg"
                                />
                                <div>
                                    <h1 className="font-bold text-gray-800 leading-none text-lg">جمعية بناء وتنمية</h1>
                                    <p className="text-xs text-gray-500 mt-1">بوابة تقييم المستفيدين</p>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Progress */}
                    <div className="w-full bg-gray-200 h-1.5">
                        <div className="h-full transition-all duration-500" style={{ width: `${(step / 4) * 100}%`, backgroundColor: COLORS.secondary }}></div>
                    </div>

                    <main className="flex-grow container mx-auto p-4 max-w-xl">
                        {step === 1 && (
                            <div className="animate-fade-in-up bg-white rounded-2xl shadow-lg p-6 sm:p-8 mt-4">
                                <h2 className="text-2xl font-bold text-gray-800 mb-2 text-center">مرحباً بك</h2>
                                <p className="text-gray-600 mb-6 text-center">فضلاً، أدخل بياناتك لتوثيق التقييم</p>
                                
                                {dailyError && (
                                    <div className="mb-6 p-4 bg-orange-50 border border-orange-200 rounded-xl flex items-start gap-3 text-orange-800">
                                        <Icons.AlertCircle className="shrink-0 mt-1" size={20} />
                                        <p className="text-sm font-semibold">{dailyError}</p>
                                    </div>
                                )}

                                <div className="space-y-5">
                                    <div>
                                        <label className="text-gray-700 font-semibold mb-2 block flex items-center gap-2">
                                            <Icons.UserCheck size={18} className="text-green-600"/> الاسم الكريم
                                        </label>
                                        <input 
                                            type="text"
                                            value={beneficiary.name}
                                            onChange={(e) => setBeneficiary({...beneficiary, name: e.target.value})}
                                            className={`w-full p-3 border rounded-xl outline-none transition-all ${errors.name ? 'border-red-500 bg-red-50' : 'border-gray-200 focus:border-green-500 focus:ring-2 focus:ring-green-100'}`}
                                            placeholder="الاسم الثلاثي"
                                            disabled={!user}
                                        />
                                        {errors.name && <p className="text-red-500 text-sm mt-1">{errors.name}</p>}
                                    </div>
                                    <div>
                                        <label className="text-gray-700 font-semibold mb-2 block flex items-center gap-2">
                                            <Icons.Smartphone size={18} className="text-green-600"/> رقم الجوال
                                        </label>
                                        <input 
                                            type="tel"
                                            value={beneficiary.phone}
                                            onChange={(e) => setBeneficiary({...beneficiary, phone: normalizeArabicNumbers(e.target.value)})}
                                            className={`w-full p-3 border rounded-xl outline-none transition-all ${errors.phone ? 'border-red-500 bg-red-50' : 'border-gray-200 focus:border-green-500 focus:ring-2 focus:ring-green-100'}`}
                                            placeholder="05xxxxxxxx"
                                            maxLength={10}
                                            disabled={!user}
                                        />
                                        {errors.phone && <p className="text-red-500 text-sm mt-1">{errors.phone}</p>}
                                    </div>
                                    
                                    <button 
                                        onClick={checkDailyLimitAndProceed} 
                                        disabled={isChecking || !user}
                                        className="w-full py-4 rounded-xl text-white font-bold text-lg shadow-lg mt-4 flex items-center justify-center gap-2 disabled:opacity-70 disabled:cursor-not-allowed hover:shadow-xl transition-all active:scale-95 disabled:bg-gray-400"
                                        style={{ backgroundColor: !user ? '#9ca3af' : COLORS.primary }}
                                    >
                                        {!user 
                                            ? <><Icons.Loader size={20} /> جاري الاتصال...</> 
                                            : isChecking 
                                                ? 'جاري التحقق...' 
                                                : 'التالي'
                                        }
                                        {user && !isChecking && <Icons.ArrowRight size={20} className="mr-1 rotate-180" />}
                                    </button>
                                </div>
                            </div>
                        )}

                        {step === 2 && (
                            <div className="animate-fade-in-up">
                                <button onClick={() => setStep(1)} className="mb-4 text-gray-500 flex items-center gap-1 text-sm font-semibold hover:text-gray-800 transition-colors">
                                    <Icons.ArrowRight size={16} /> العودة
                                </button>
                                <h2 className="text-xl font-bold text-gray-800 text-center mb-6">من قام بخدمتك اليوم؟</h2>
                                <div className="grid grid-cols-1 gap-4">
                                    {EMPLOYEES.map((emp) => (
                                        <button key={emp.id} onClick={() => { setSelectedEmployee(emp); setStep(3); }} className="bg-white p-4 rounded-xl shadow-sm hover:shadow-md border border-transparent hover:border-green-500 flex items-center gap-4 group transition-all">
                                            <div className="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center text-gray-400 group-hover:bg-green-50 transition-colors shrink-0">
                                                <Icons.User size={30} />
                                            </div>
                                            <div className="text-right flex-grow">
                                                <h3 className="font-bold text-lg text-gray-800">{emp.name}</h3>
                                                <p className="text-sm text-gray-500">{emp.role}</p>
                                            </div>
                                            <Icons.ArrowRight size={20} className="rotate-180 text-gray-300 group-hover:text-green-500" />
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {step === 3 && selectedEmployee && (
                            <form onSubmit={handleSubmit} className="animate-fade-in-up bg-white rounded-2xl shadow-lg p-6 sm:p-8">
                                <button type="button" onClick={() => setStep(2)} className="text-sm text-gray-400 mb-6 flex items-center gap-1 hover:text-gray-600"><Icons.ArrowRight size={16} /> تغيير الموظف</button>
                                <div className="bg-gray-50 rounded-xl p-4 flex items-center gap-4 mb-8 border border-gray-100">
                                    <div className="w-12 h-12 bg-white rounded-full flex items-center justify-center text-gray-400 shadow-sm"><Icons.User size={24} /></div>
                                    <div><p className="text-xs text-gray-500">تقييم الموظف:</p><h3 className="font-bold text-gray-800">{selectedEmployee.name}</h3></div>
                                </div>
                                <div className="space-y-8">
                                    {RATING_CRITERIA.map((criteria) => (
                                        <div key={criteria.id} className="text-center">
                                            <label className="block text-gray-700 font-bold mb-3">{criteria.label}</label>
                                            <div className="flex flex-row-reverse justify-center gap-3">
                                                {[5, 4, 3, 2, 1].map((star) => (
                                                    <button key={star} type="button" onClick={() => handleRatingChange(criteria.id, star)} className={`transition-all transform hover:scale-125 focus:outline-none ${(ratings[criteria.id] || 0) >= star ? 'text-yellow-400' : 'text-gray-200'}`}>
                                                        <Icons.Star size={36} fill={(ratings[criteria.id] || 0) >= star ? "currentColor" : "none"} />
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                    <div className="pt-4 border-t border-gray-100">
                                        <label className="block text-gray-700 font-semibold mb-2 flex items-center gap-2"><Icons.MessageSquare size={18} />ملاحظات (اختياري)</label>
                                        <textarea rows="3" value={comment} onChange={(e) => setComment(e.target.value)} className="w-full p-3 border border-gray-200 rounded-lg outline-none bg-gray-50 focus:ring-2 focus:ring-green-100 focus:border-green-500" placeholder="هل واجهتك أي مشكلة؟"></textarea>
                                    </div>
                                    <button type="button" onClick={(e) => { if(Object.keys(ratings).length === 0) return alert('الرجاء اختيار تقييم واحد على الأقل'); handleSubmit(e); }} disabled={isSubmitting} className="w-full py-4 rounded-xl text-white font-bold text-lg shadow-lg flex items-center justify-center gap-2 hover:shadow-xl transition-all active:scale-95" style={{ backgroundColor: COLORS.secondary }}>
                                        {isSubmitting ? 'جاري الإرسال...' : 'إرسال التقييم'} <Icons.Send size={20} className="mr-1" />
                                    </button>
                                </div>
                            </form>
                        )}

                        {step === 4 && (
                            <div className="animate-fade-in-up text-center py-12 px-4 bg-white rounded-2xl shadow-lg mt-8">
                                <div className="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6"><Icons.CheckCircle size={48} className="text-green-600" /></div>
                                <h2 className="text-3xl font-bold text-gray-800 mb-2">شكراً لك</h2>
                                <p className="text-gray-600 mb-8">تم استلام تقييمك بنجاح.</p>
                                <button onClick={resetForm} className="px-6 py-2 rounded-lg text-gray-500 hover:bg-gray-100 text-sm font-semibold transition-colors">العودة للرئيسية</button>
                            </div>
                        )}
                    </main>

                    <footer className="bg-gray-800 text-white mt-auto pt-6 pb-6 text-sm">
                        <div className="container mx-auto px-4 text-center">
                            <div className="border-t border-gray-700 pt-4 text-gray-500 text-xs flex justify-between items-center">
                                <span>جمعية بناء وتنمية مساكن بمنطقة جازان</span>
                                <button onClick={onAdminRequest} className="opacity-30 hover:opacity-100 transition-opacity p-1"><Icons.Lock size={14} /></button>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        function App() {
            const [user, setUser] = useState(null);
            const [view, setView] = useState('user'); // 'user', 'admin', 'login'
            
            useEffect(() => {
                if (!auth) return;
                
                const initAuth = async () => {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await auth.signInWithCustomToken(__initial_auth_token);
                    } else {
                        await auth.signInAnonymously();
                    }
                };
                initAuth();
                const unsubscribe = auth.onAuthStateChanged(setUser);
                return () => unsubscribe();
            }, []);

            if (view === 'admin') {
                return <AdminDashboard user={user} onLogout={() => setView('user')} />;
            } else if (view === 'login') {
                return <AdminLogin onBack={() => setView('user')} onSuccess={() => setView('admin')} />;
            } else {
                return <UserEvaluationForm user={user} onAdminRequest={() => setView('login')} />;
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
