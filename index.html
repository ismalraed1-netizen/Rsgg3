<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#F06F17">
<title>منصة بطاقات الموظفين | جمعية بناء وتنمية مساكن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--o:#F06F17;--g:#74BD2C;--y:#98999A;--ink:#25272A;--bg:#F6F7F5}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Tajawal","Cairo",sans-serif;color:var(--ink);background:var(--bg)}
body{background:radial-gradient(circle at 8% 10%,rgba(116,189,44,.08),transparent 24%),radial-gradient(circle at 92% 12%,rgba(240,111,23,.08),transparent 25%),var(--bg)}
.topline{height:4px;background:linear-gradient(90deg,var(--y),var(--g),var(--o))}
header{position:relative;background:rgba(255,255,255,.96);border-bottom:1px solid rgba(37,39,42,.07);overflow:hidden}
header:before{content:"";position:absolute;left:-70px;bottom:-85px;width:350px;height:170px;opacity:.14;background-image:radial-gradient(var(--y) 1.6px,transparent 1.8px);background-size:14px 14px;mask-image:linear-gradient(90deg,#000,transparent)}
.wrap{max-width:1480px;margin:auto;padding:16px 24px}.head{display:flex;align-items:center;justify-content:space-between;gap:20px;position:relative}.brand{display:flex;align-items:center;gap:15px;min-width:0}
.logoBox{width:74px;height:82px;background:#fff;border:1px solid rgba(37,39,42,.07);border-radius:19px;padding:8px;box-shadow:0 12px 34px rgba(37,39,42,.08);display:flex;align-items:center;justify-content:center;flex:none}
.logoBox img{width:100%;height:100%;object-fit:contain}.kickers{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:5px}.pill{font-size:10px;font-weight:800;padding:5px 9px;border-radius:999px}.pill.g{color:#569C18;background:rgba(116,189,44,.11)}.pill.o{color:var(--o);background:rgba(240,111,23,.1)}
h1{font-size:27px;line-height:1.15;margin:0;font-weight:800;letter-spacing:-.4px}.sub{font-size:12px;color:#85878A;margin-top:5px;font-weight:600}
.actions{display:flex;align-items:center;gap:9px}.btn{height:40px;border:0;border-radius:12px;padding:0 15px;font-family:inherit;font-size:11px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:7px;transition:.2s}.btn:hover{transform:translateY(-1px)}
.btn.dark{background:var(--ink);color:#fff}.btn.orange{background:var(--o);color:#fff;box-shadow:0 8px 22px rgba(240,111,23,.18)}
.identity{max-width:1480px;margin:12px auto 0;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:14px}.identity p{margin:0;font-size:11px;color:#777A7D}.swatches{display:flex;align-items:center;gap:13px;font-size:10px;color:#85878A}.sw{display:inline-flex;align-items:center;gap:5px}.dot{width:9px;height:9px;border-radius:50%}
.frameWrap{max-width:1480px;margin:10px auto 0;padding:0 14px 18px}.frameCard{background:rgba(255,255,255,.6);border:1px solid rgba(37,39,42,.07);border-radius:26px;box-shadow:0 20px 65px rgba(37,39,42,.07);overflow:hidden;min-height:780px}
iframe{display:block;width:100%;height:calc(100vh - 205px);min-height:780px;border:0;background:transparent}
footer{max-width:1480px;margin:0 auto;padding:0 24px 18px;color:#919397;font-size:10px;display:flex;justify-content:space-between;gap:10px}
@media(max-width:760px){.wrap{padding:12px 14px}.head{align-items:flex-start}.logoBox{width:58px;height:66px;border-radius:15px}h1{font-size:19px}.sub{font-size:10px}.actions .dark{display:none}.btn{height:36px;padding:0 12px}.identity{padding:0 14px;align-items:flex-start;flex-direction:column}.frameWrap{padding:0 8px 12px}.frameCard{border-radius:18px}.swatches{gap:8px}iframe{height:calc(100vh - 220px);min-height:720px}footer{padding:0 14px 12px;flex-direction:column}}
@media print{header,.identity,footer{display:none!important}.frameWrap{margin:0;padding:0}.frameCard{border:0;box-shadow:none}.frameCard,iframe{height:100vh;min-height:0}}
</style>
</head>
<body>
<div class="topline"></div>
<header>
  <div class="wrap">
    <div class="head">
      <div class="brand">
        <div class="logoBox"><img src="assets/logo.png" alt="شعار جمعية بناء وتنمية مساكن"></div>
        <div>
          <div class="kickers"><span class="pill g">الهوية البصرية المعتمدة</span><span class="pill o">منصة البطاقات</span></div>
          <h1>تصميم بطاقات الموظفين</h1>
          <div class="sub">جمعية بناء وتنمية مساكن بمنطقة جازان</div>
        </div>
      </div>
      <div class="actions">
        <a class="btn dark" href="https://www.bena-jazan.sa" target="_blank" rel="noopener">الموقع الرسمي ↗</a>
        <button class="btn orange" id="printBtn">طباعة البطاقة 🖨</button>
      </div>
    </div>
  </div>
</header>

<div class="identity">
  <p>تم توحيد واجهة المنصة وفق شعار وألوان ورسومات دليل الهوية البصرية للجمعية.</p>
  <div class="swatches">
    <span class="sw"><i class="dot" style="background:#F06F17"></i>#F06F17</span>
    <span class="sw"><i class="dot" style="background:#74BD2C"></i>#74BD2C</span>
    <span class="sw"><i class="dot" style="background:#98999A"></i>#98999A</span>
  </div>
</div>

<div class="frameWrap">
  <div class="frameCard"><iframe id="appFrame" src="app.html" title="منصة تصميم بطاقات الموظفين"></iframe></div>
</div>

<footer><span>© 2026 جمعية بناء وتنمية مساكن بمنطقة جازان</span><span>جازان - المملكة العربية السعودية</span></footer>

<script>
const frame=document.getElementById('appFrame');
document.getElementById('printBtn').onclick=()=>frame.contentWindow.print();

frame.addEventListener('load',()=>{
  const d=frame.contentDocument;
  if(!d)return;
  const style=d.createElement('style');
  style.textContent=`
    html,body{background:transparent!important}
    body{font-family:"Tajawal","Cairo",sans-serif!important;color:#25272A!important}
    body>header,body>footer{display:none!important}
    main{max-width:1440px!important;margin:0 auto!important;padding:18px!important;gap:24px!important}
    main>div:first-child{border-radius:22px!important;border:1px solid rgba(152,153,154,.18)!important;box-shadow:0 15px 46px rgba(37,39,42,.07)!important;max-height:calc(100vh - 46px)!important}
    main>div:nth-child(2){padding-top:3px!important}
    main>div:nth-child(2)>.no-print:first-child{background:#fff!important;border:1px solid rgba(152,153,154,.16)!important;border-radius:18px!important;padding:12px 16px!important;box-shadow:0 10px 30px rgba(37,39,42,.04)!important}
    #idCardFront,#idCardBack{border-radius:20px!important;border:1px solid rgba(152,153,154,.20)!important;box-shadow:0 22px 55px rgba(37,39,42,.15)!important}
    #headerAccent{background:linear-gradient(105deg,#F06F17,#D9570A)!important}
    #footerAccentFront{background:#74BD2C!important}
    #footerAccentBack{background:#F06F17!important}
    #topTitleBadge,#previewTitle{color:#F06F17!important}
    #avatarFrame{border-color:rgba(240,111,23,.32)!important}
    button[onclick="window.print()"]{background:linear-gradient(90deg,#F06F17,#D9570A)!important}
    input:focus,select:focus{--tw-ring-color:rgba(240,111,23,.22)!important;border-color:#F06F17!important}
    .animated-waves{opacity:.11!important}
    .animated-dots{opacity:.09!important}
    @media(max-width:1024px){main{padding:12px!important}main>div:first-child{max-height:none!important}}
  `;
  d.head.appendChild(style);

  ['cardLogoFront','cardLogoBack'].forEach(id=>{
    const img=d.getElementById(id); if(img){img.src='assets/logo.png';img.onerror=null;}
  });

  const reset=d.getElementById('btnResetLogo');
  if(reset) reset.addEventListener('click',()=>setTimeout(()=>{
    ['cardLogoFront','cardLogoBack'].forEach(id=>{const img=d.getElementById(id);if(img)img.src='assets/logo.png';});
  },0));

  d.querySelectorAll('.fill-brandOrange').forEach(el=>el.style.fill='#F06F17');
  d.querySelectorAll('.fill-brandGreen').forEach(el=>el.style.fill='#74BD2C');

  const oldDesc=[...d.querySelectorAll('p')].find(p=>p.textContent.includes('دليل هوية مساكن'));
  if(oldDesc)oldDesc.textContent='أدخل بيانات الموظف واختر نمط التصميم وفق الهوية البصرية المعتمدة للجمعية.';
});
</script>
</body>
</html>
